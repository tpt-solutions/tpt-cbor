[package]
name = "tpt-cbor-bench"
description = "Criterion benchmarks for tpt-cbor"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Not part of the main workspace. Its dependencies are dev-only and never
# reach tpt-cbor itself.
[workspace]

[dependencies]
tpt-cbor = { path = "../crates/tpt-cbor", version = "0.1.0", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "codec"
harness = false
